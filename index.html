<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAA Part 107 Flashcards</title>
<style>
  :root {
    --blue: #003366;
    --blue-mid: #1a4f8a;
    --blue-light: #e8f0fa;
    --accent: #c8102e;
    --green: #1a7a2e;
    --green-light: #eaf6ec;
    --amber: #a9640a;
    --amber-light: #fdf3e3;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --border: #d1d5db;
    --white: #ffffff;
    --text: #111827;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e9edf2;
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--blue);
    color: white;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .faa-seal {
    width: 48px; height: 48px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 12px; color: var(--blue);
    letter-spacing: -0.5px; flex-shrink: 0;
  }
  .header-title { min-width: 0; }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header p { font-size: 0.76rem; opacity: 0.8; margin-top: 2px; }
  .header-right { margin-left: auto; }
  a.simlink {
    display: inline-block;
    color: white; font-size: 0.78rem; text-decoration: none; white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 6px;
    opacity: 0.9;
  }
  a.simlink:hover { background: rgba(255,255,255,0.12); }

  main {
    max-width: 760px;
    margin: 28px auto 60px;
    padding: 0 16px;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  select, .btn {
    font-family: inherit;
    font-size: 0.85rem;
  }
  select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    color: var(--text);
  }
  .btn {
    border: 1px solid var(--border);
    background: white;
    color: var(--blue);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--blue-light); }
  .btn.active { background: var(--blue); color: white; border-color: var(--blue); }
  .spacer { flex: 1; }
  .stat-pill {
    font-size: 0.76rem;
    background: var(--gray-light);
    padding: 5px 10px;
    border-radius: 999px;
    color: var(--gray);
    font-weight: 600;
    white-space: nowrap;
  }
  .stat-pill.mastered { background: var(--green-light); color: var(--green); }
  .stat-pill.learning { background: var(--amber-light); color: var(--amber); }

  /* ===== PROGRESS ===== */
  .progress-wrap { margin-bottom: 16px; }
  .progress-track {
    height: 8px;
    background: var(--gray-light);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }
  .progress-fill-mastered { background: var(--green); height: 100%; }
  .progress-fill-learning { background: var(--amber); height: 100%; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--gray); margin-top: 6px;
  }

  /* ===== CARD ===== */
  .card-stage {
    perspective: 1600px;
    margin-bottom: 20px;
  }
  .flashcard {
    position: relative;
    width: 100%;
    min-height: clamp(280px, 48vh, 340px);
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    padding: 32px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .face-front { background: white; }
  .face-back { background: var(--blue-light); transform: rotateY(180deg); }

  .card-cat {
    display: inline-block;
    align-self: flex-start;
    background: var(--blue);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .card-idx {
    position: absolute;
    top: 16px; right: 20px;
    font-size: 0.75rem;
    color: var(--gray);
    font-weight: 600;
  }
  .card-question {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
  }
  .card-hint {
    font-size: 0.78rem;
    color: var(--gray);
    text-align: center;
    margin-top: 12px;
  }
  .card-answer-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--green);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .card-answer {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .card-explanation {
    font-size: 0.92rem;
    color: #374151;
    line-height: 1.55;
    flex: 1;
  }
  .card-choices {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--gray);
  }
  .card-choices div { padding: 2px 0; }
  .card-choices .wrong-choice { text-decoration: line-through; opacity: 0.6; }

  /* ===== NAV ===== */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .nav-btn {
    background: white;
    border: 1px solid var(--border);
    color: var(--blue);
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--blue-light); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover { background: white; }

  .rate-row {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
  }
  .rate-btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .rate-btn:active { transform: scale(0.98); }
  .rate-learning { background: var(--amber-light); color: var(--amber); border: 2px solid #f2c98a; }
  .rate-learning:hover { filter: brightness(0.97); }
  .rate-mastered { background: var(--green-light); color: var(--green); border: 2px solid #a9dcb2; }
  .rate-mastered:hover { filter: brightness(0.97); }
  .rate-hint { text-align: center; font-size: 0.72rem; color: var(--gray); margin-bottom: 20px; }

  .empty-state {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
  }
  .empty-state h2 { color: var(--blue); margin-bottom: 8px; }
  .empty-state p { color: var(--gray); font-size: 0.9rem; margin-bottom: 18px; }

  @media (max-width: 600px) {
    main { padding: 0 12px; margin-top: 16px; }
    header { padding: 12px 16px; }
    .faa-seal { width: 40px; height: 40px; font-size: 11px; }
    header h1 { font-size: 1rem; }
    header p { font-size: 0.72rem; }
    .header-right { margin-left: 0; width: 100%; }
    a.simlink { display: inline-block; }
    .toolbar { padding: 12px; gap: 8px; }
    #category-select, #mode-select { flex: 1 1 100%; }
    .stat-pill { font-size: 0.72rem; padding: 4px 8px; }
    .face { padding: 20px; }
    .card-question { font-size: 1.05rem; }
    .card-answer { font-size: 1.05rem; }
    .rate-row { gap: 8px; }
    .rate-btn { padding: 13px 8px; font-size: 0.88rem; }
  }

  @media (max-width: 360px) {
    .flashcard { min-height: clamp(260px, 52vh, 320px); }
    .face { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="faa-seal">FAA<br>107</div>
  <div class="header-title">
    <h1>Part 107 Flashcards</h1>
    <p>Remote Pilot Certificate — Aeronautical Knowledge Review</p>
  </div>
  <div class="header-right">
    <a class="simlink" href="Part107_Exam_Simulator.html">Take Full Exam →</a>
  </div>
</header>

<main>

  <div class="toolbar">
    <select id="category-select" onchange="onCategoryChange()"></select>
    <select id="mode-select" onchange="onModeChange()">
      <option value="all">All cards</option>
      <option value="learning">Still learning only</option>
      <option value="unseen">Unseen only</option>
    </select>
    <button class="btn" id="shuffle-btn" onclick="toggleShuffle()">🔀 Shuffle</button>
    <div class="spacer"></div>
    <span class="stat-pill mastered" id="stat-mastered">0 mastered</span>
    <span class="stat-pill learning" id="stat-learning">0 learning</span>
    <span class="stat-pill" id="stat-total">0 total</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill-mastered" id="progress-mastered" style="width:0%"></div>
      <div class="progress-fill-learning" id="progress-learning" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span id="progress-pos">Card 0 of 0</span>
      <span id="progress-pct">0% mastered</span>
    </div>
  </div>

  <div id="card-area"></div>

</main>

<script>
// ============================================================
//  QUESTION BANK (source: Part107_Exam_Simulator.html, 120 Qs)
// ============================================================
const QUESTION_BANK = [
// ---- REGULATIONS ----
{ category: "Regulations", question: "Under 14 CFR Part 107, what is the maximum groundspeed for a small UAS?", choices: ["87 knots (100 mph)", "100 knots (115 mph)", "55 knots (63 mph)"], answer: 0, explanation: "Part 107.51(b) limits sUAS groundspeed to no more than 87 knots (100 mph) during flight." },
{ category: "Regulations", question: "What is the minimum age to obtain a Remote Pilot Certificate under Part 107?", choices: ["14 years old", "16 years old", "18 years old"], answer: 1, explanation: "14 CFR 107.61(a) requires applicants to be at least 16 years of age." },
{ category: "Regulations", question: "What is the maximum altitude a remote pilot may operate a sUAS without a waiver?", choices: ["500 feet AGL", "400 feet AGL", "1,000 feet AGL"], answer: 1, explanation: "Part 107.51(b) limits operations to 400 feet AGL, unless within 400 feet of a structure." },
{ category: "Regulations", question: "How long after consuming alcohol must a remote pilot wait before operating a sUAS?", choices: ["4 hours", "8 hours", "12 hours"], answer: 1, explanation: "14 CFR 107.27 prohibits operation within 8 hours of consuming alcohol ('8 hours bottle to throttle')." },
{ category: "Regulations", question: "A remote pilot must report an accident to the FAA if property damage exceeds what dollar amount?", choices: ["$250", "$500", "$1,000"], answer: 1, explanation: "Part 107.9 requires reporting within 10 calendar days if property damage exceeds $500 (excluding the UA itself)." },
{ category: "Regulations", question: "Within how many calendar days must a remote pilot report an accident to the FAA?", choices: ["5 calendar days", "10 calendar days", "30 calendar days"], answer: 1, explanation: "14 CFR 107.9 requires an accident report to the FAA within 10 calendar days." },
{ category: "Regulations", question: "How often must a remote pilot complete recurrent training or testing to remain current?", choices: ["Every 12 calendar months", "Every 24 calendar months", "Every 36 calendar months"], answer: 1, explanation: "Part 107.65 requires a recurrent knowledge test or online training course every 24 calendar months." },
{ category: "Regulations", question: "Who has final authority over a sUAS flight and is directly responsible for its safety?", choices: ["The Visual Observer (VO)", "The Remote Pilot in Command (RPIC)", "The person physically manipulating the controls"], answer: 1, explanation: "The RPIC has final authority and is directly responsible for the safety of the operation, per 14 CFR 107.19." },
{ category: "Regulations", question: "Under Part 107, a sUAS must yield right-of-way to which of the following?", choices: ["All manned aircraft", "Only aircraft flying IFR", "Only aircraft on approach to land"], answer: 0, explanation: "14 CFR 107.37 requires the sUAS to yield right-of-way to ALL manned aircraft at all times." },
{ category: "Regulations", question: "A sUAS that weighs more than 0.55 lbs must be registered with the FAA before flight. Registration is valid for how long?", choices: ["1 year", "3 years", "5 years"], answer: 1, explanation: "FAA registration costs $5 and is valid for 3 years. Renewals must be completed on time." },
{ category: "Regulations", question: "During a Part 107 operation, where must the registration number be displayed?", choices: ["Inside a battery compartment", "On the exterior of the UA, legibly", "Only in the FAA DroneZone database"], answer: 1, explanation: "The registration number must be marked on the exterior of the UA and must be legible." },
{ category: "Regulations", question: "Part 107 allows a sUAS to exceed 400 ft AGL under which condition?", choices: ["When flying over water", "When within 400 feet of a structure", "When operating in Class G airspace"], answer: 1, explanation: "When operating within 400 feet of a structure, the sUAS may fly up to 400 feet above the structure (not AGL from the ground)." },
{ category: "Regulations", question: "Under Part 107, sUAS flight operations during civil twilight require what equipment?", choices: ["A strobe that is visible for 1 statute mile", "An anti-collision light visible for 3 statute miles", "An IR beacon detectable by night vision"], answer: 1, explanation: "107.29 permits operations during civil twilight with anti-collision lighting visible for 3 statute miles." },
{ category: "Regulations", question: "What blood alcohol concentration (BAC) limit applies to remote pilot operations under Part 107?", choices: ["0.08%", "0.04%", "0.02%"], answer: 1, explanation: "14 CFR 107.27 prohibits operation with a BAC of 0.04% or higher, which is half the standard DUI limit." },
{ category: "Regulations", question: "A person may manipulate the controls of a sUAS without holding a Remote Pilot Certificate if:", choices: ["They are over 18 years old", "A certificated Remote Pilot in Command is present and responsible", "The UAS weighs less than 0.55 lbs"], answer: 1, explanation: "Under 107.12, a non-certificated person may operate under the direct supervision of a certificated RPIC who is able to immediately take control." },
{ category: "Regulations", question: "To obtain a Part 107 Remote Pilot Certificate, a person must pass a knowledge test at:", choices: ["An FAA Flight Standards District Office (FSDO)", "An FAA-approved Knowledge Testing Center", "Any DMV office with TSA clearance"], answer: 1, explanation: "The Part 107 aeronautical knowledge test must be taken at an FAA-approved testing center." },
{ category: "Regulations", question: "Remote ID requires a sUAS to broadcast which of the following?", choices: ["The pilot's name and address", "The UA's location, altitude, velocity, and serial number", "Only the UA's GPS coordinates"], answer: 1, explanation: "Remote ID broadcasts include UA location/altitude, control station location, velocity, serial number, and time mark." },
{ category: "Regulations", question: "Under Part 107, the minimum flight visibility from the control station is:", choices: ["1 statute mile", "3 statute miles", "5 statute miles"], answer: 1, explanation: "14 CFR 107.51(c) requires a minimum flight visibility of 3 statute miles from the control station." },
{ category: "Regulations", question: "What is the minimum cloud clearance requirement for a sUAS under Part 107?", choices: ["1,000 ft below and 1 mile horizontally", "500 ft below and 2,000 ft horizontally", "500 ft above and 1,000 ft horizontally"], answer: 1, explanation: "14 CFR 107.51 requires the sUAS to remain at least 500 feet below clouds and 2,000 feet horizontally from clouds." },
{ category: "Regulations", question: "Which operation requires a Part 107 waiver?", choices: ["Flying at 350 ft AGL in Class G airspace during daylight", "Flying at night (outside civil twilight)", "Flying over a sparsely populated rural area"], answer: 1, explanation: "Nighttime operations (outside civil twilight) require an FAA waiver per 14 CFR 107.200." },
// ---- AIRSPACE ----
{ category: "Airspace", question: "What type of airspace is typically found above 18,000 feet MSL?", choices: ["Class E airspace", "Class A airspace", "Class B airspace"], answer: 1, explanation: "Class A airspace exists from 18,000 ft MSL to FL600. sUAS operations in Class A are not permitted." },
{ category: "Airspace", question: "On a sectional chart, what does a magenta dashed line indicate?", choices: ["Class B airspace boundary", "Class D airspace boundary", "Class E airspace starting at 700 ft AGL"], answer: 2, explanation: "A magenta dashed line on a sectional chart depicts Class E airspace that begins at 700 feet AGL." },
{ category: "Airspace", question: "LAANC stands for:", choices: ["Low Altitude Aeronautical Notification Clearance", "Low Altitude Authorization and Notification Capability", "Licensed Airspace Authorization for Non-Commercial"], answer: 1, explanation: "LAANC (Low Altitude Authorization and Notification Capability) provides near real-time sUAS authorizations in controlled airspace." },
{ category: "Airspace", question: "You want to fly a sUAS at 200 feet AGL within Class D airspace. What must you do first?", choices: ["No action needed — Class D is uncontrolled", "Obtain FAA authorization before flying", "Notify local law enforcement"], answer: 1, explanation: "Class D airspace is controlled airspace. Part 107.41 requires FAA authorization (via LAANC or DroneZone) before operating." },
{ category: "Airspace", question: "Which type of Special Use Airspace completely prohibits all aircraft from entering?", choices: ["Restricted Area", "Prohibited Area", "Military Operations Area (MOA)"], answer: 1, explanation: "Prohibited Areas (e.g., P-56 over Washington, D.C.) are off-limits to all aircraft at all times." },
{ category: "Airspace", question: "A Temporary Flight Restriction (TFR) is established over a wildfire area. A remote pilot may fly in this TFR:", choices: ["If below 400 ft AGL", "Only with specific FAA authorization", "If operating under Part 107"], answer: 1, explanation: "TFRs override standard Part 107 operations. You must have specific authorization to operate within a TFR regardless of altitude." },
{ category: "Airspace", question: "Class G airspace is best described as:", choices: ["Controlled airspace from the surface to 18,000 ft MSL", "Uncontrolled airspace where ATC has no authority", "Airspace surrounding Class B airports"], answer: 1, explanation: "Class G is uncontrolled airspace. ATC does not provide separation services. sUAS operations are generally permitted here within other Part 107 limits." },
{ category: "Airspace", question: "On a sectional chart, a blue dashed circle around an airport symbol typically indicates:", choices: ["Class E surface area", "Class D airspace", "Class C airspace"], answer: 1, explanation: "A blue dashed line depicts Class D airspace, which exists around airports with operating control towers." },
{ category: "Airspace", question: "Where can a remote pilot check for current NOTAMs before a flight?", choices: ["FAA DroneZone registration portal", "1800wxbrief.com or FAA NOTAM Search", "The airport manager's office"], answer: 1, explanation: "NOTAMs should be checked at 1800wxbrief.com, the FAA NOTAM Search system, or aviation apps before every flight." },
{ category: "Airspace", question: "The UAS Facility Map (UASFM) grid altitude at a location shows '0'. What does this mean?", choices: ["Unlimited altitude is approved via LAANC", "LAANC authorization is not available there — a manual DroneZone request is needed", "No sUAS flights are permitted there under any circumstances"], answer: 1, explanation: "A grid altitude of 0 on the UASFM means LAANC cannot issue an automatic authorization. The pilot must submit a manual authorization request through FAA DroneZone." },
{ category: "Airspace", question: "Class B airspace is typically found:", choices: ["Around military training bases", "Around the nation's busiest commercial airports", "Above remote mountainous terrain"], answer: 1, explanation: "Class B airspace surrounds the nation's busiest airports (e.g., LAX, ORD, JFK) and requires authorization for sUAS operations." },
{ category: "Airspace", question: "A runway is numbered '27'. This means the runway is oriented toward approximately:", choices: ["270 degrees (west)", "027 degrees (north-northeast)", "207 degrees (south-southwest)"], answer: 0, explanation: "Runway numbers represent the magnetic heading divided by 10. Runway 27 = 270° magnetic = west." },
{ category: "Airspace", question: "Which airspace requires ATC communication but is voluntary for VFR pilots (though sUAS pilots still need authorization)?", choices: ["Class B", "Class D", "Class C"], answer: 2, explanation: "Class C requires communication with ATC for manned aircraft. sUAS pilots need authorization to operate in Class C regardless." },
// ---- WEATHER ----
{ category: "Weather", question: "What weather condition is reported as 'BKN015' in a METAR?", choices: ["Broken clouds at 15,000 feet MSL", "Broken clouds at 1,500 feet AGL", "Sky clear below 1,500 feet"], answer: 1, explanation: "METAR cloud heights are reported in hundreds of feet AGL. BKN015 = Broken clouds at 1,500 feet AGL. Broken clouds represent a ceiling." },
{ category: "Weather", question: "What is density altitude?", choices: ["The altitude shown on the altimeter when set to 29.92", "Pressure altitude corrected for non-standard temperature", "The altitude above mean sea level of the terrain below"], answer: 1, explanation: "Density altitude is pressure altitude corrected for temperature deviations from standard. High density altitude means reduced air density and degraded aircraft performance." },
{ category: "Weather", question: "In a winds aloft forecast, a code of '9900' indicates:", choices: ["Winds exceeding 99 knots at that level", "Light and variable winds (less than 5 knots)", "Data unavailable for that altitude"], answer: 1, explanation: "The code '9900' in winds aloft forecasts means light and variable winds of less than 5 knots." },
{ category: "Weather", question: "Which type of fog is most likely to form on a calm, clear night over moist ground?", choices: ["Advection fog", "Radiation fog", "Upslope fog"], answer: 1, explanation: "Radiation fog forms when the ground cools via radiation on clear, calm nights, cooling the air above it to the dew point." },
{ category: "Weather", question: "The current METAR for your departure airport shows 'SCT030 BKN080'. What is the ceiling?", choices: ["3,000 feet AGL", "8,000 feet AGL", "There is no ceiling"], answer: 1, explanation: "A ceiling is the lowest broken or overcast layer. BKN080 = broken at 8,000 ft AGL. That is the ceiling." },
{ category: "Weather", question: "Winds aloft forecasts reference wind direction relative to:", choices: ["Magnetic North", "True North", "Grid North"], answer: 1, explanation: "Winds aloft (and surface winds in aviation forecasts) use True North. Surface winds in METARs use magnetic north." },
{ category: "Weather", question: "What three conditions are required for thunderstorm formation?", choices: ["Stable air, moisture, and cold fronts", "Lifting action, unstable air, and sufficient moisture", "Low pressure, strong winds, and high humidity"], answer: 1, explanation: "Thunderstorms require a lifting mechanism, atmospheric instability, and high moisture content." },
{ category: "Weather", question: "AIRMET Tango is issued for:", choices: ["Icing conditions", "Moderate turbulence and surface winds over 30 knots", "IFR conditions and mountain obscuration"], answer: 1, explanation: "AIRMET Tango covers moderate turbulence (non-convective), moderate icing on the surface, and sustained surface winds of 30 knots or more." },
{ category: "Weather", question: "When temperature and dew point are within 2–3°C of each other, a pilot should anticipate:", choices: ["Excellent visibility and smooth air", "Possible fog or low clouds", "Strong thunderstorm development"], answer: 1, explanation: "A small temperature-dew point spread indicates high relative humidity. When they converge, fog or low clouds are likely to form." },
{ category: "Weather", question: "How are cloud heights reported in winds aloft forecasts different from METARs?", choices: ["Both use AGL (above ground level)", "Winds aloft altitudes are MSL; METAR clouds are AGL", "Winds aloft altitudes are AGL; METAR clouds are MSL"], answer: 1, explanation: "In METARs, cloud heights are AGL. Winds aloft forecast altitudes are MSL. This distinction is critical when evaluating conditions." },
{ category: "Weather", question: "What is a microburst?", choices: ["A rapidly moving cold front", "A localized intense downdraft that spreads out at the surface, creating severe wind shear", "A sudden pressure drop near a large lake"], answer: 1, explanation: "A microburst is an intense column of air descending from a thunderstorm that hits the surface and spreads outward, creating dangerous wind shear. It typically lasts 5–15 minutes." },
{ category: "Weather", question: "Standard sea level pressure in the ISA (International Standard Atmosphere) is:", choices: ["30.00 in Hg", "29.92 in Hg", "29.50 in Hg"], answer: 1, explanation: "Standard sea level pressure is 29.92 in Hg (1013.25 millibars). This is the ISA standard used for pressure altitude calculations." },
{ category: "Weather", question: "Unstable air is associated with which weather condition?", choices: ["Layered stratus clouds and steady rain", "Cumulonimbus clouds and showery precipitation", "Smooth air and poor visibility at the surface"], answer: 1, explanation: "Unstable air produces cumuliform (vertical) clouds, turbulence, good visibility, and showery precipitation." },

// Assign a stable id to each card (index in the master bank)
QUESTION_BANK.forEach((q, i) => q.id = i);

// ============================================================
//  STATE
// ============================================================
const STORAGE_KEY = 'part107_flashcard_progress_v1';
let progress = loadProgress(); // { [id]: 'mastered' | 'learning' }
let deck = [];       // current ordered list of card ids being studied
let pos = 0;          // index into deck
let flipped = false;
let shuffleOn = false;

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) { return {}; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

// ============================================================
//  SETUP
// ============================================================
function categories() {
  const set = new Set(QUESTION_BANK.map(q => q.category));
  return Array.from(set).sort();
}

function populateCategorySelect() {
  const sel = document.getElementById('category-select');
  sel.innerHTML = '<option value="all">All categories (' + QUESTION_BANK.length + ')</option>';
  categories().forEach(cat => {
    const count = QUESTION_BANK.filter(q => q.category === cat).length;
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat + ' (' + count + ')';
    sel.appendChild(opt);
  });
}

function buildDeck() {
  const cat = document.getElementById('category-select').value;
  const mode = document.getElementById('mode-select').value;

  let cards = QUESTION_BANK.filter(q => cat === 'all' || q.category === cat);

  if (mode === 'learning') {
    cards = cards.filter(q => progress[q.id] === 'learning');
  } else if (mode === 'unseen') {
    cards = cards.filter(q => !progress[q.id]);
  }

  let ids = cards.map(q => q.id);
  if (shuffleOn) ids = shuffleArray(ids);

  deck = ids;
  pos = 0;
  flipped = false;
  render();
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function onCategoryChange() { buildDeck(); }
function onModeChange() { buildDeck(); }
function toggleShuffle() {
  shuffleOn = !shuffleOn;
  document.getElementById('shuffle-btn').classList.toggle('active', shuffleOn);
  buildDeck();
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  renderStats();
  renderCard();
}

function renderStats() {
  const total = QUESTION_BANK.length;
  const masteredCount = QUESTION_BANK.filter(q => progress[q.id] === 'mastered').length;
  const learningCount = QUESTION_BANK.filter(q => progress[q.id] === 'learning').length;

  document.getElementById('stat-mastered').textContent = masteredCount + ' mastered';
  document.getElementById('stat-learning').textContent = learningCount + ' learning';
  document.getElementById('stat-total').textContent = total + ' total';

  document.getElementById('progress-mastered').style.width = (masteredCount / total * 100) + '%';
  document.getElementById('progress-learning').style.width = (learningCount / total * 100) + '%';
  document.getElementById('progress-pct').textContent = Math.round(masteredCount / total * 100) + '% mastered';
}

function renderCard() {
  const area = document.getElementById('card-area');

  if (deck.length === 0) {
    document.getElementById('progress-pos').textContent = 'Card 0 of 0';
    area.innerHTML = `
      <div class="empty-state">
        <h2>No cards match this filter</h2>
        <p>Try a different category, or switch mode back to "All cards".</p>
        <button class="btn" onclick="document.getElementById('mode-select').value='all'; onModeChange();">Show all cards</button>
      </div>`;
    return;
  }

  const id = deck[pos];
  const q = QUESTION_BANK[id];
  const status = progress[id];

  document.getElementById('progress-pos').textContent = 'Card ' + (pos + 1) + ' of ' + deck.length;

  const choicesHtml = q.choices.map((c, i) =>
    `<div class="${i === q.answer ? '' : 'wrong-choice'}">${i === q.answer ? '✓ ' : '– '}${c}</div>`
  ).join('');

  area.innerHTML = `
    <div class="card-stage">
      <div class="flashcard ${flipped ? 'flipped' : ''}" id="flashcard" onclick="flipCard()">
        <div class="face face-front">
          <span class="card-idx">#${id + 1}</span>
          <span class="card-cat">${q.category}</span>
          <div class="card-question">${q.question}</div>
          <div class="card-hint">Click card or press Space to flip</div>
        </div>
        <div class="face face-back">
          <span class="card-idx">#${id + 1}</span>
          <span class="card-cat">${q.category}</span>
          <div class="card-answer-label">Correct Answer</div>
          <div class="card-answer">${q.choices[q.answer]}</div>
          <div class="card-explanation">${q.explanation}</div>
          <div class="card-choices">${choicesHtml}</div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" onclick="prevCard()" ${pos === 0 ? 'disabled' : ''} title="Previous">‹</button>
      <button class="nav-btn" onclick="flipCard()" title="Flip">⟳</button>
      <button class="nav-btn" onclick="nextCard()" ${pos === deck.length - 1 ? 'disabled' : ''} title="Next">›</button>
    </div>

    <div class="rate-row">
      <button class="rate-btn rate-learning" onclick="rateCard('learning')">Still learning ${status === 'learning' ? '●' : ''}</button>
      <button class="rate-btn rate-mastered" onclick="rateCard('mastered')">Got it ${status === 'mastered' ? '●' : ''}</button>
    </div>
    <div class="rate-hint">Rating auto-advances to the next card · Keyboard: ← → to navigate, Space to flip, 1 = still learning, 2 = got it, R = reset progress</div>
  `;
}

function flipCard() {
  flipped = !flipped;
  const el = document.getElementById('flashcard');
  if (el) el.classList.toggle('flipped', flipped);
}

function nextCard() {
  if (pos < deck.length - 1) {
    pos++;
    flipped = false;
    render();
  }
}
function prevCard() {
  if (pos > 0) {
    pos--;
    flipped = false;
    render();
  }
}

function rateCard(status) {
  const id = deck[pos];
  progress[id] = status;
  saveProgress();
  if (pos < deck.length - 1) {
    setTimeout(() => { nextCard(); }, 120);
  } else {
    render();
  }
}

function resetProgress() {
  if (confirm('Reset all mastery progress? This cannot be undone.')) {
    progress = {};
    saveProgress();
    render();
  }
}

// ============================================================
//  KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (deck.length === 0) return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      flipCard();
      break;
    case 'ArrowRight':
      nextCard();
      break;
    case 'ArrowLeft':
      prevCard();
      break;
    case 'Digit1':
      rateCard('learning');
      break;
    case 'Digit2':
      rateCard('mastered');
      break;
    case 'KeyR':
      resetProgress();
      break;
  }
});

// ============================================================
//  INIT
// ============================================================
populateCategorySelect();
buildDeck();
</script>
</body>
</html>
